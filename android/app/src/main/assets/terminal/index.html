<!DOCTYPE html>
<!--
  UChat terminal page — xterm.js (MIT) bridged to a native PTY.
  See NOTICE.md for licenses of the vendored xterm.js files.
-->
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="stylesheet" href="xterm.css" />
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #16181F; overflow: hidden;
    }
    #terminal {
      width: 100%; height: calc(100% - 4px);
      padding: 2px; box-sizing: border-box;
    }
    .xterm .xterm-viewport { background-color: transparent !important; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>
  <script src="xterm-addon-search.js"></script>
  <script src="xterm-addon-web-links.js"></script>
  <script>
    (function () {
      var term = new window.Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: "Menlo, monospace",
        theme: {
          background: "#16181F",
          foreground: "#E6E6E6",
          cursor: "#E5484D",
          selectionBackground: "#3B4261",
          black: "#16181F", red: "#E5484D", green: "#4CC38A",
          yellow: "#F5D90A", blue: "#5CA7E4", magenta: "#D765B6",
          cyan: "#5BD1D5", white: "#E6E6E6",
          brightBlack: "#8B8B8B", brightRed: "#FF6166",
          brightGreen: "#6BE2A2", brightYellow: "#FCEB5E",
          brightBlue: "#8ABFF2", brightMagenta: "#E784C4",
          brightCyan: "#7FE3E7", brightWhite: "#FFFFFF"
        },
        scrollback: 5000,
        allowProposedApi: true
      });
      var fit = new window.FitAddon.FitAddon();
      var search = new window.SearchAddon.SearchAddon();
      var webLinks = new window.WebLinksAddon.WebLinksAddon();
      term.loadAddon(fit);
      term.loadAddon(search);
      term.loadAddon(webLinks);
      term.open(document.getElementById("terminal"));
      try { fit.fit(); } catch (e) { }

      term.onData(function (data) {
        if (window.UChatTerminal) window.UChatTerminal.onTerminalInput(data);
      });

      window.UChatTerm = {
        write: function (text) { term.write(text); },
        exit: function (code) {
          term.write("\r\n\x1b[90m[process exited with code " + code + "]\x1b[0m\r\n");
        },
        resize: function (cols, rows) {
          try { term.resize(cols, rows); } catch (e) { }
        },
        setFontSize: function (px) { term.options.fontSize = px; try { fit.fit(); } catch (e) { } },
        paste: function (text) { term.paste(text); },
        searchNext: function (q) { return search.findNext(q); },
        searchPrev: function (q) { return search.findPrevious(q); },
        clearSearch: function () { search.clearDecorations(); },
        clear: function () { term.clear(); },
        selectAll: function () { term.selectAll(); },
        getSelection: function () { return term.getSelection(); }
      };

      function reportSize() {
        try {
          fit.fit();
          if (window.UChatTerminal) {
            window.UChatTerminal.onTerminalResize(term.cols, term.rows);
          }
        } catch (e) { }
      }
      window.addEventListener("resize", reportSize);
      setTimeout(reportSize, 60);
      setTimeout(reportSize, 400);
      if (window.UChatTerminal) window.UChatTerminal.onTerminalReady();
    })();
  </script>
</body>
</html>
